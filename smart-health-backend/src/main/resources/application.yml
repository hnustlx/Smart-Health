server:
  port: 8080

spring:
  application:
    name: smart-health-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/smart_health?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smarthealth.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

ai:
  provider: deepseek  # 可选 deepseek / ollama

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat
  url: https://api.deepseek.com/v1/chat/completions

ollama:
  url: http://localhost:11434
  model: qwen3.5:9b

chroma:
  url: ${CHROMA_URL:http://localhost:8000}
  collection-name: smart_health_knowledge

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
