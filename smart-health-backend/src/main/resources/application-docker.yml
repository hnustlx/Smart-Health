server:
  port: 8080
  tomcat:
    threads:
      max: 10
      min-spare: 2

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/smart_health?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  flyway:
    enabled: true

chroma:
  url: http://chroma:8000

logging:
  level:
    com.smarthealth: info
